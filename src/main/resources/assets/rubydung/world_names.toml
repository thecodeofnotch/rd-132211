# Random world names for the "New World" screen (the Random button next to the name box).
#
# A name is built by picking one pattern, then replacing every {category} in it with a random word from
# [words].category. The first letter of the finished name is always capitalised.
#
#   "The {adjective} {location} of {noun}"   ->   "The Murky Hollow of Echoes"
#
# - Any key in [words] is a category and can be used in a pattern as {key}. Add as many as you like.
# - A pattern that uses a category that doesn't exist (or is empty) is skipped and reported in the log.
# - Every pattern is equally likely: to make one more common, list it more than once.
# - Names longer than the name box (32 characters) or already used by a world are thrown away and a new one is picked,
#   so very long words just make that combination rarer.
# - Keep to letters, digits and spaces: the name is also the world's folder name.
#
# Format modeled on the Terraria world names: https://terraria.wiki.gg/wiki/World/Name

[names]
patterns = [
    "The {adjective} {location} of {noun}",
    "{adjective} {location} of {noun}",
    "The {adjective} {location}",
    "{adjective} {location}",
    "The {location} of {noun}",
    "{location} of {noun}",
]

# Example of a new category: uncomment these, then add "The {color} {location}" to the patterns above.
# [words]
# color = ["Crimson", "Ashen", "Indigo"]

